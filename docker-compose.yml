services:
  web:
    build: .
    image: ${DOCKER_USERNAME:-yourusername}/flask-docker-app:latest
    container_name: flask-docker-app
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/health').status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
